# AGENTS.md §0 claims "CI runs domain tests on every push". This is that CI:
# one job, the same `pnpm check` a developer runs (typecheck, lint, Prettier on
# the code folders, and every vitest project — the i18n key check is one of the
# tests).
#
# Also `pnpm i18n:release-check`: it refuses any `_review` marker, so a string
# that has not had its translation review (an AI pass against
# docs/i18n-glossary.md — owner ruling 2026-10-01, replacing spec R11's native
# speaker) cannot merge. The vendored contracts are pinned by a test inside
# `pnpm check` (test/contractPins.test.ts); nothing fetches the web repo (R7).
name: check

# PRs are validated before they merge; main is re-checked after, since a merge
# can combine two green branches into a red tree.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: the job only reads the repo and the engine's package.
permissions:
  contents: read
  # @seazn/engine is on GitHub Packages (plan S2-1 Task 1): the install reads it with this token.
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A clean run takes a few minutes; a hung vitest worker should not hold a
    # runner for the default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Reads the pnpm version from package.json `packageManager`.
      - uses: pnpm/action-setup@v4
      # `registry-url` and `scope` write the @onryde registry and its `${NODE_AUTH_TOKEN}` credential to a
      # user-level .npmrc: pnpm ignores a credential in the project's (.npmrc says why).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@onryde'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm i18n:release-check
