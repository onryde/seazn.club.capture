# AGENTS.md §0 claims "CI runs domain tests on every push". Until this file it
# did not. One job, the same `pnpm check` a developer runs, plus the i18n
# release check once Task 6 adds it.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
