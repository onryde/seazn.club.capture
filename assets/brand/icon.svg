<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon, full bleed: the OS draws the corners. The web's app tile
       (seazn.club apps/web/public/logo-square.png), redrawn at 1024. -->
