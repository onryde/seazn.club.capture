    <linearGradient id="night" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#150b36"/>
      <stop offset="0.5" stop-color="#1d1042"/>
      <stop offset="1" stop-color="#2e1a5c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#night)"/>
  <rect x="138" y="650" width="748" height="52" rx="26" fill="#a3e635"/>
  <circle cx="737" cy="541" r="125" fill="#1e1b2e"/>
  <circle cx="737" cy="541" r="108" fill="#ef4444"/>
