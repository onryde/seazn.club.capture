# Settings only — this is a single-package repo, not a workspace. pnpm reads
# its settings from this file, matching the main repo's convention.
#
# Default (isolated) linker, deliberately. Expo supports isolated installs from
# SDK 54, and it was checked here rather than assumed: typecheck, lint, tests,
# a web and an Android Metro export, and `expo-modules-autolinking` resolving
# every native module (expo-*, react-native-webview, async-storage) through the
# .pnpm store for both platforms. A blanket `node-linker=hoisted` would restore
# npm's accidental resolutions and hide the phantom dependencies the strict
# linker exists to surface. If a native library ever needs hoisting, name that
# one package in `publicHoistPattern` with the evidence, as the main repo does.

# Install scripts pnpm skips, each checked and not needed:
#   dtrace-provider — optional DTrace probes for bunyan, via eas-cli. Unused.
#   protobufjs      — postinstall only prints a version-compatibility notice.
#   unrs-resolver   — napi-postinstall fallback for a missing platform binding.
#                     The binding installs as an optional dependency; proven by
#                     eslint-import-resolver-typescript resolving `@/ui` in the
#                     boundaries rule.
# Listed so a new install script shows up as a decision, not a silent skip.
ignoredBuiltDependencies:
  - dtrace-provider
  - protobufjs
  - unrs-resolver

# Dependabot alerts on transitive packages: each pinned to the patched release
# within the vulnerable version's own major. Left open on purpose (the fix is a
# major bump or there is no patch): deepmerge, node-forge, decode-uri-component
# (0.2 -> 0.5), uuid 7 and 8, zod 3.
overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  compression@1: 1.8.2
  handlebars@4: 4.7.10
  joi@17: 17.13.8
  minimatch@5: 5.1.9
  moment@2: 2.31.0
  nanoid@3: 3.3.12
  shell-quote@1: 1.11.0
  source-map-js@1: 1.2.2
  undici@8: 8.12.2
  vite@8: 8.3.3
  zod@4: 4.6.6
