plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.seazn.capture.engine'
version = '0.1.0'

android {
  namespace "com.seazn.capture.engine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Final review M6: what an app that minifies must keep for this module's reflection (AudioSessionIds).
    consumerProguardFiles 'consumer-rules.pro'
  }
  // CD2: the pure core and adapters compile into this library, so no settings.gradle edit and no
  // composite build. Their own Gradle build (core/) still runs every JVM test in CI.
  sourceSets {
    main.java.srcDirs += ['core/src/main/kotlin']
  }
  lintOptions {
    abortOnError false
  }
}

// Strict pins (Global Constraints). StreamPack 3.2.1 (C7u, owner 2026-10-05, for StreamPack#302) carries Kotlin
// metadata 2.4 and needs compileSdk 37: the app compiles with Kotlin 2.3.0 (app.json's kotlinVersion, which this
// module's config plugin, app.plugin.ts, takes to the Kotlin Gradle plugin) against android-37.
dependencies {
  ['core', 'ui', 'srt', 'rtmp'].each { part ->
    implementation("io.github.thibaultbee.streampack:streampack-$part") { version { strictly '3.2.1' } }
  }
  // 1.10.1, the version streampack-srt 3.2.1 names. javap against 1.10.0: it adds only `trySend`, which our
  // sink now calls (StreamPack#302); `connect`, `close` and the socket's completion are unchanged (C6 I-2).
  implementation('io.github.thibaultbee.srtdroid:srtdroid-ktx') { version { strictly '1.10.1' } }
  // streampack-rtmp's RTMP client, and the Ktor network stack whose TLS closer F-P5-12 is about. komuxer 0.5.0
  // runs on Ktor 3.5.1 (its Gradle module), so the TLS pin moves with it: 3.3.3 under 3.5.1's network would mix.
  implementation('io.github.komedia.komuxer:rtmp') { version { strictly '0.5.0' } }
  implementation('io.ktor:ktor-network-tls') { version { strictly '3.5.1' } }
  // C7u: StreamPack 3.2.1 asks for androidx.core 1.19.0 and lifecycle 2.11.0, whose AARs (core 1.19.0, and the
  // lifecycle compose artifacts it lifts to 2.11.0) demand AGP 9.1; this Expo SDK's AGP is 8.12, so the app's
  // checkDebugAarMetadata refuses them. Held at what the rest of the app asks for. javap: each of the 14
  // androidx.core and androidx.lifecycle members StreamPack 3.2.1 references exists in 1.18.0 and 2.10.0.
  // Remove when the app's AGP reaches 9.1.
  constraints {
    implementation('androidx.core:core') { version { strictly '1.18.0' } }
    implementation('androidx.core:core-ktx') { version { strictly '1.18.0' } }
    implementation('androidx.lifecycle:lifecycle-runtime') { version { strictly '2.10.0' } }
  }
  // Review C7 M-5: React's PermissionAwareActivity, checked by type (Permissions.kt). Unversioned, the pattern
  // every Expo module in this app uses: React Native's Gradle plugin pins the version.
  implementation 'com.facebook.react:react-android'
  // M14: compiled against, never shipped by us, so the app has exactly one OkHttp. react-android 0.86.3
  // asks for 4.9.2, and the app resolves 4.12.0 (fresco's and media3's OkHttp lift it); 4.9.2 is the
  // floor this compiles against, and core's JVM tests run the adapter on 4.12.0.
  compileOnly 'com.squareup.okhttp3:okhttp:4.9.2'
}
